spring:
  application:
    name: mathru-product-service
    
  h2:    console:      enabled: true
      
  jpa:    database-platform: org.hibernate.dialect.H2Dialect
  datasource:    url: jdbc:h2:mem:testdb
    username: sa  
    password: password 
    driverClassName: org.h2.Driver
          
    
eureka:
  client:    serviceUrl:      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka}
      
      
management:
  endpoint:    hystrix:      stream:        enabled: true
  endpoints:    web:      exposure:        include: '*'
hystrix:
  dashboard:
    proxy-stream-allow-list: '*'      